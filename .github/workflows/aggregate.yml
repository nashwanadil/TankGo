name: Aggregate fuel prices
on:
  schedule:
    - cron: "17 5,13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python scripts/aggregate.py
        env:
          OUT_DIR: site/v1
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      - name: Publish data branch
        working-directory: site
        run: |
          git config user.name "tankgo-bot"
          git config user.email "tankgo-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push origin data
