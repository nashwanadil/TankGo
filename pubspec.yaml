name: fuelprices
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.7
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-800.ttf
          weight: 800
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-700.ttf
          weight: 700
        - asset: assets/fonts/NotoKufiArabic-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#6B1A2E"
  adaptive_icon_foreground: assets/icon_fg.png
  web:
    generate: true
    image_path: assets/icon.png
