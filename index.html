@font-face{font-family:'Readex Pro';font-style:normal;font-weight:200 700;font-display:swap;src:url(fonts/readex-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--wine:#8f2a39;--wine2:#6b1a2e;--deep:#2a0a12;--gold:#e0b860;--gold2:#f3d58c;--cream:#f5ece0;--ink:#2a1d17;--green:#7fd4a8;--red:#ff9a8f;--glass:rgba(255,255,255,.06);--line:rgba(245,236,224,.14)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.6 "Readex Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;color:var(--cream);background:var(--deep);overflow-x:hidden}
a{color:var(--gold)}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 700px at 10% -10%,#9e2f42 0,transparent 60%),radial-gradient(900px 600px at 110% 20%,#5a1526 0,transparent 60%),linear-gradient(180deg,#3b0c15,#1c060c 70%)}
.bg::before,.bg::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 18s ease-in-out infinite}
.bg::before{background:var(--gold);top:30%;left:-180px}.bg::after{background:#c2485f;bottom:-160px;right:-120px;animation-delay:-9s}
@keyframes float{50%{transform:translate(80px,-60px) scale(1.1)}}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:-.5px;color:#fff;text-decoration:none;direction:ltr}
.logo svg{width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(224,184,96,.45));transition:transform .4s}.logo:hover svg{transform:rotate(-8deg) scale(1.05)}
.logo b{color:var(--gold);font-weight:700}
.langs{display:flex;gap:6px}.langs button{background:var(--glass);border:1px solid var(--line);color:var(--cream);border-radius:999px;padding:7px 14px;font:600 14px "Readex Pro",sans-serif;cursor:pointer;min-width:44px}
.langs button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:40px 0 70px}
h1{font-size:clamp(32px,4.9vw,56px);line-height:1.1;margin:0 0 18px;color:#fff;letter-spacing:-1px;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.8vw,19px);opacity:.9;max-width:560px}
.cheap{margin:26px 0;display:inline-flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 18px;backdrop-filter:blur(6px)}
.cheap b{color:var(--gold);font-size:22px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(127,212,168,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(127,212,168,0)}100%{box-shadow:0 0 0 0 rgba(127,212,168,0)}}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:16px;padding:14px 22px;font-weight:800;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);box-shadow:0 10px 30px rgba(224,184,96,.35)}
.btn.ghost{border:1.5px solid var(--gold);color:var(--gold)}
.btn small{display:block;font-weight:600;font-size:11px;opacity:.75}
/* phone */
.phone{justify-self:center;width:290px;height:590px;border-radius:44px;background:#120408;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px #3a1520;position:relative;transform:rotate(-3deg);animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-1deg) translateY(-12px)}}
.screen{height:100%;border-radius:34px;background:#f5f1f0;overflow:hidden;color:var(--ink);padding:44px 14px 14px;position:relative}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:12px;background:#120408}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e0d2cc;border-radius:12px;padding:5px 10px;font-weight:700;font-size:13px;background:#fff}
.pcard{margin-top:12px;border-radius:24px;padding:20px 12px;text-align:center;color:#fff;background:linear-gradient(135deg,#9e2f42,#6b1a2e);border:2px solid var(--gold);box-shadow:0 10px 28px rgba(143,42,57,.4)}
.pcard .f{color:var(--gold);font-weight:900;letter-spacing:1.5px;font-size:12px}
.pcard .p{font-size:38px;font-weight:900;margin:4px 0}
.pcard .d{display:inline-block;background:var(--gold);color:var(--ink);border-radius:10px;padding:4px 12px;font-weight:900;font-size:14px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tiles div{background:#fff;border:1px solid #e8dcd6;border-radius:12px;padding:8px 2px;text-align:center;font-size:11px}.tiles b{display:block;font-size:13px}
.spark{margin-top:10px;background:#fff;border:1px solid #e8dcd6;border-radius:16px;padding:8px}
section{padding:60px 0}
h2{font-size:clamp(26px,3.4vw,40px);margin:0 0 8px;color:#fff}
.sub{opacity:.8;margin:0 0 26px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:26px;padding:22px;backdrop-filter:blur(8px)}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{background:none;border:0;color:var(--cream);padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--ink)}
.board{display:grid;gap:6px}
.row{display:grid;grid-template-columns:28px 44px 1fr 92px 64px;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;transition:background .2s}
.row:hover{background:rgba(255,255,255,.05)}.row.me{background:rgba(224,184,96,.14);outline:1px solid rgba(224,184,96,.5)}
.rank{opacity:.6;font-weight:800;font-size:13px;text-align:center}
.cc{font-weight:700;font-size:12px;letter-spacing:.5px;color:var(--ink);background:var(--gold);border-radius:8px;text-align:center;padding:4px 0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.bar{position:absolute;inset:auto 0 -3px 0;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .bar{transform-origin:right}
.price{font-weight:900;text-align:end;font-variant-numeric:tabular-nums}.price .pro,.srow .pro{margin:0}
.delta{font-size:12px;font-weight:800;text-align:end}.up{color:var(--red)}.down{color:var(--green)}.flat{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
label{display:block;font-size:13px;font-weight:700;opacity:.8;margin:0 0 6px}
select,input{width:100%;background:rgba(0,0,0,.28);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-weight:700}
select option{color:#000}
.save{display:grid;gap:8px;margin-top:16px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22)}
.srow b{font-size:18px}.pos{color:var(--green)}.neg{color:var(--red)}
.big{font-size:clamp(30px,4vw,46px);font-weight:900;color:var(--gold)}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{padding:22px;border-radius:22px;background:var(--glass);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.feat:hover{transform:translateY(-4px);border-color:rgba(224,184,96,.6)}
.feat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(224,184,96,.16);color:var(--gold);margin-bottom:12px}
.feat h3{margin:0 0 6px;color:#fff}.feat p{margin:0;opacity:.8;font-size:15px}
.pro{font-size:11px;font-weight:900;color:var(--ink);background:var(--gold);border-radius:8px;padding:2px 7px;margin-inline-start:6px;vertical-align:middle}
.outlook{display:flex;align-items:center;gap:18px}
.arrow{font-size:54px;line-height:1}
footer{padding:40px 0 60px;border-top:1px solid var(--line);opacity:.75;font-size:14px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}.reveal.in{opacity:1;transform:none}
[dir=rtl] body{line-height:1.8}[dir=rtl] h1{line-height:1.3;letter-spacing:0}[dir=rtl] h2,[dir=rtl] .feat h3{letter-spacing:0}
button,select,input{font-family:inherit}
@media (max-width:860px){.logo{font-size:24px}.logo svg{width:44px;height:44px}.hero{grid-template-columns:1fr}.phone{transform:none;margin-top:10px}.grid2,.feats{grid-template-columns:1fr}.row{grid-template-columns:24px 40px 1fr 80px 52px;gap:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const FUEL={en:{e95:'Petrol 95',diesel:'Diesel',lpg:'LPG'},de:{e95:'Benzin 95',diesel:'Diesel',lpg:'LPG'},ar:{e95:'بنزين 95',diesel:'ديزل',lpg:'غاز LPG'}};
const NB={AT:['DE','CZ','SK','HU','SI','IT'],BE:['NL','DE','LU','FR'],BG:['RO','GR'],HR:['SI','HU'],CY:[],CZ:['DE','AT','SK','PL'],DK:['DE','SE'],EE:['LV','FI'],FI:['SE','EE'],FR:['BE','LU','DE','IT','ES'],DE:['DK','NL','BE','LU','FR','CZ','AT','PL'],GR:['BG'],HU:['AT','SK','RO','HR','SI'],IE:[],IT:['FR','AT','SI'],LV:['EE','LT'],LT:['LV','PL'],LU:['BE','DE','FR'],MT:['IT'],NL:['BE','DE'],PL:['DE','CZ','SK','LT'],PT:['ES'],RO:['BG','HU'],SK:['CZ','AT','PL','HU'],SI:['AT','IT','HR','HU'],ES:['PT','FR'],SE:['DK','FI']};
const PREM=new Set(['FR','DE','IT','ES','AT','HR','GR','PT','NL']);
const PRO='<span class="pro">PREMIUM</span>';
const ICONS=['M3 12h4l3-8 4 16 3-8h4','M4 19V5m0 14h16M8 15l3-4 3 2 4-6','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-9 9h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18','M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14','M3 17l6-6 4 4 8-8m0 0h-5m5 0v5','M4 5h16M9 3v2c0 6-3 10-5 12m5-6c1.5 3 4 5.5 7 7M14 21l4-9 4 9m-7-2h6'];
let L='en',D=null,S=null,fuel='e95';
const $=id=>document.getElementById(id);
const nf=(v,d=3)=>new Intl.NumberFormat(L==='ar'?'ar':L,{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const eur=(v,d=3)=>'\u2066'+nf(v,d)+' €\u2069';
const region=cc=>{try{return new Intl.DisplayNames([L],{type:'region'}).of(cc)}catch(e){return cc}};
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString(L,{day:'numeric',month:'short',year:'numeric'});
const guessHome=()=>{const r=(navigator.language||'').split('-')[1];return r&&D&&D[r.toUpperCase()]?.currency==='EUR'?r.toUpperCase():'DE'};
function eu(){return Object.entries(D||{}).filter(([c,e])=>e.currency==='EUR'&&e.prices[fuel]!=null)}
function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=T[l][el.dataset.t]);
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 $('foot').innerHTML=T[l].foot;
 $('feats').innerHTML=T[l].feats.map(([h,p,pro],i)=>`<div class="feat"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[i]}"/></svg></div><h3>${h}${pro?'<span class="pro">PREMIUM</span>':''}</h3><p>${p}</p></div>`).join('');
 $('fuelSeg').innerHTML=['e95','diesel','lpg'].map(f=>`<button data-f="${f}" class="${f===fuel?'on':''}">${FUEL[l][f]}</button>`).join('');
 try{localStorage.setItem('tg_lang',l)}catch(e){}
 render()}
function render(){if(!D)return;
 const rows=eu().sort((a,b)=>a[1].prices[fuel]-b[1].prices[fuel]);if(!rows.length)return;
 const lo=rows[0][1].prices[fuel],hi=rows[rows.length-1][1].prices[fuel],home=$('home').value||guessHome();
 $('rows').innerHTML=rows.map(([c,e],i)=>{const p=e.prices[fuel],pv=e.prev?.[fuel],d=pv==null?0:p-pv,cls=Math.abs(d)<.0005?'flat':d>0?'up':'down';
  const lk=PREM.has(c)&&c!==home;
  return `<div class="row ${c===home?'me':''}"><span class="rank">${i+1}</span><span class="cc">${c}</span><span class="name">${region(c)}<i class="bar" data-w="${lk?0:(hi===lo?1:.15+.85*(p-lo)/(hi-lo)).toFixed(3)}"></i></span><span class="price">${lk?PRO:eur(p)}</span><span class="delta ${cls}">${lk||pv==null?'':(cls==='flat'?'→':(d>0?'▲ +':'▼ ')+nf(d*100,1))}</span></div>`}).join('');
 requestAnimationFrame(()=>document.querySelectorAll('.bar').forEach(b=>b.style.transform=`scaleX(${b.dataset.w})`));
 const ch=eu().filter(([c])=>!PREM.has(c)).sort((a,b)=>a[1].prices.e95-b[1].prices.e95)[0];
 if(ch){$('cheapV').textContent=`${region(ch[0])} · ${eur(ch[1].prices.e95)}`}
 const dates=rows.map(r=>r[1].date).sort();$('asof').textContent=`${T[L].asof} ${fdate(dates[dates.length-1])}`;
 // home select
 const sel=$('home');if(!sel.options.length||sel.dataset.l!==L){const cur=sel.value||home;sel.innerHTML=eu().map(([c])=>[c,region(c)]).sort((a,b)=>a[1].localeCompare(b[1],L)).map(([c,n])=>`<option value="${c}">${n}</option>`).join('');sel.value=cur;sel.dataset.l=L}
 border();phone()}
function border(){const home=$('home').value,lit=+$('litres').value||0,hp=D[home]?.prices[fuel];if(hp==null)return;
 const list=(NB[home]||[]).filter(c=>D[c]?.prices[fuel]!=null).map(c=>[c,(hp-D[c].prices[fuel])*lit]).sort((a,b)=>b[1]-a[1]);
 $('save').innerHTML=list.map(([c,s])=>{const lk=PREM.has(c);return `<div class="srow"><span><span class="cc" style="display:inline-block;width:38px;margin-inline-end:10px">${c}</span>${region(c)}${lk?'':' · '+eur(D[c].prices[fuel])}</span>${lk?PRO:`<b class="${s>=0?'pos':'neg'}">${Math.abs(s)<.005?T[L].same:(s>0?'+':'−')+eur(Math.abs(s),2)}</b>`}</div>`}).join('')||`<div class="srow">–</div>`;
 const best=list.filter(([c])=>!PREM.has(c))[0];$('bestV').textContent=best&&best[1]>0?`${eur(best[1],2)} · ${region(best[0])}`:'–'}
async function phone(){const home=$('home').value||'DE',e=D[home];if(!e)return;
 $('phCC').textContent=home;$('phName').textContent=region(home);$('phFuel').textContent=FUEL[L][fuel].toUpperCase();
 const p=e.prices[fuel];$('phPrice').textContent=p==null?'–':'\u2066'+nf(p)+' € /L\u2069';
 const pv=e.prev?.[fuel];$('phChg').innerHTML=pv==null||p==null?'':`<span style="color:${p>pv?'#ffb4ab':'#a5e8c0'}">${p>pv?'▲ +':'▼ '}${nf((p-pv)*100,1)} ct</span>`;
 $('phDate').textContent=fdate(e.date);
 $('phTiles').innerHTML=['e95','diesel','lpg'].filter(f=>e.prices[f]!=null).map(f=>`<div>${FUEL[L][f]}<b>${nf(e.prices[f])}</b></div>`).join('');
 try{const h=await (await fetch(`v1/history/${home}.json`)).json();const pts=Object.entries(h.points).sort().slice(-52).map(([d,v])=>v[fuel]).filter(v=>v!=null);
  if(pts.length>1){const lo=Math.min(...pts),hi=Math.max(...pts),x=i=>i*240/(pts.length-1),y=v=>62-(hi===lo?.5:(v-lo)/(hi-lo))*54;
   const dd=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
   $('phSpark').innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a24" stop-opacity=".35"/><stop offset="1" stop-color="#b98a24" stop-opacity="0"/></linearGradient></defs><path d="${dd}L240,70L0,70Z" fill="url(#g)"/><path d="${dd}" fill="none" stroke="#b98a24" stroke-width="2.5"/>`}}catch(e){}}
function outlook(){if(!S)return;$('outSec').hidden=false;const k=S.direction==='up'?'up':S.direction==='down'?'down':'flat';
 $('outA').textContent=k==='up'?'↗':k==='down'?'↘':'→';$('outA').style.color=k==='up'?'var(--red)':k==='down'?'var(--green)':'var(--gold)';
 $('outP').textContent=T[L][k].replace('{d}',(S.delta_ct_l>0?'+':'')+nf(S.delta_ct_l,1))}
document.addEventListener('click',e=>{const l=e.target.closest('.langs button');if(l)return setLang(l.dataset.l),outlook();const f=e.target.closest('#fuelSeg button');if(f){fuel=f.dataset.f;setLang(L)}});
$('home').addEventListener('change',()=>render());$('litres').addEventListener('input',border);
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
let saved=null;try{saved=localStorage.getItem('tg_lang')}catch(e){}
const nl=(navigator.language||'en').slice(0,2);setLang(saved||(['de','ar'].includes(nl)?nl:'en'));
fetch('v1/latest.json').then(r=>r.json()).then(j=>{D=j.countries;render();$('home').value=guessHome();render()}).catch(()=>{$('cheapV').textContent='–'});
fetch('v1/signal.json').then(r=>r.ok?r.json():null).then(j=>{S=j;outlook()}).catch(()=>{});
</script>
</body>
</html>
